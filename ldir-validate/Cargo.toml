[package]
name = "ldir-validate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LDIR IR well-formedness validator"
repository.workspace = true
readme = "README.md"
keywords = ["validator", "ir", "document", "cli"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "ldir-validate"
path = "src/main.rs"

[dependencies]
ldir-ir = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
