[package]
name = "ldir-validate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LDIR IR well-formedness validator"

[[bin]]
name = "ldir-validate"
path = "src/main.rs"

[dependencies]
ldir-ir = { path = "../ldir-ir" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
