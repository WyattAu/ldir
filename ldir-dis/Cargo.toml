[package]
name = "ldir-dis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LDIR IR disassembler — converts binary S-IR to human-readable text"
repository.workspace = true
readme = "README.md"
keywords = ["disassembler", "ir", "document", "cli"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "ldir-dis"
path = "src/main.rs"

[dependencies]
ldir-ir = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
