# Test Vector Specification for LDIR Knuth-Plass Line Breaking
# Covers ALG-KP-BREAK correctness, edge cases, and penalty handling

[metadata]
algorithm_id = "ALG-KP-BREAK"
algorithm_version = "0.1.0"
generation_date = "2026-05-15T00:00:00Z"
generator = "manual"
verification_status = "verified"

[precision_requirements]
floating_point_type = "f64"
absolute_tolerance = 1e-10
relative_tolerance = 1e-8
ulp_tolerance = 0
note = "Line breaking uses f64 for badness and demerits calculations. Demerits = (line_badness + penalty)^3."

# ============================================================
# CATEGORY: NOMINAL (33% coverage — 2 of 6 vectors)
# ============================================================

[[test_vector]]
id = "TV-LB-001"
name = "Single word fits"
category = "nominal"
priority = "critical"
description = "A single word shorter than the line width requires no line breaks."

[test_vector.input]
words = ["hello"]
word_widths = [48000]
line_width = 302400
glue_width = 6000
glue_stretch = 3000
glue_shrink = 1000

[test_vector.expected_output]
line_breaks = 0
demerits = 0.0
badness = 0.0
status = "single_line"

[test_vector.domain_constraints]
references = ["NC-001"]
note = "1 entity, well within NC-001 max entity limit."

[test_vector.verification]
source = "Reference implementation: Knuth-Plass paragraph formatter (1981)"
method = "Reference implementation"
confidence = 0.99
verifier = "DeepThought"
verification_date = "2026-05-15"

[[test_vector]]
id = "TV-LB-002"
name = "Exact fit"
category = "nominal"
priority = "critical"
description = "Two words whose combined width plus inter-word glue exactly equals the line width. Badness = 0."

[test_vector.input]
words = ["hello", "world"]
word_widths = [48000, 48000]
line_width = 102000
glue_width = 6000
glue_stretch = 3000
glue_shrink = 1000

[test_vector.expected_output]
line_breaks = 0
demerits = 0.0
badness = 0.0
adjustment_ratio = 1.0
status = "perfect_fit"

[test_vector.domain_constraints]
references = ["NC-001"]

[test_vector.verification]
source = "Reference implementation: 48000 + 6000 + 48000 = 102000 == line_width"
method = "Reference implementation"
confidence = 0.99
verifier = "DeepThought"
verification_date = "2026-05-15"

# ============================================================
# CATEGORY: BOUNDARY (33% coverage — 2 of 6 vectors)
# ============================================================

[[test_vector]]
id = "TV-LB-003"
name = "Hyphenation needed"
category = "boundary"
priority = "high"
description = "A word that does not fit on the current line must be hyphenated to avoid infinite shrink."

[test_vector.input]
words = ["supercalifragilisticexpialidocious"]
word_widths = [320000]
line_width = 200000
glue_width = 6000
glue_stretch = 0
glue_shrink = 3000
hyphen_penalty = 50
hyphenated_fragments = [{ text = "supercalifragilis", width = 160000 }, { text = "ticexpialidocious", width = 160000 }]

[test_vector.expected_output]
line_breaks = 1
requires_hyphenation = true
demerits_gt = 0.0
demerits_lt = 200000.0

[test_vector.domain_constraints]
references = ["NC-001"]
note = "Word width (320000) exceeds line width (200000) even with maximum shrink."

[test_vector.verification]
source = "Reference implementation: word exceeds line_width - max_shrink, requiring hyphenation"
method = "Reference implementation"
confidence = 0.95
verifier = "DeepThought"
verification_date = "2026-05-15"

[[test_vector]]
id = "TV-LB-004"
name = "Forced break"
category = "boundary"
priority = "high"
description = "Content that exceeds the line width with no stretch and minimal shrink, forcing a break at a suboptimal position."

[test_vector.input]
words = ["aaaa", "bbbb", "cccc"]
word_widths = [100000, 100000, 100000]
line_width = 204000
glue_width = 4000
glue_stretch = 0
glue_shrink = 0
forced_break_penalty = 0

[test_vector.expected_output]
line_breaks = 1
adjustment_ratio_gt = 0.95
adjustment_ratio_lt = 1.05
status = "forced"

[test_vector.domain_constraints]
references = ["NC-001"]

[test_vector.verification]
source = "Reference implementation: 100000 + 4000 + 100000 = 204000 == line_width, second line single word"
method = "Reference implementation"
confidence = 0.95
verifier = "DeepThought"
verification_date = "2026-05-15"

# ============================================================
# CATEGORY: ADVERSARIAL (33% coverage — 2 of 6 vectors)
# ============================================================

[[test_vector]]
id = "TV-LB-005"
name = "Empty paragraph"
category = "adversarial"
priority = "high"
description = "Paragraph with zero words. Algorithm must handle gracefully without panicking."

[test_vector.input]
words = []
word_widths = []
line_width = 302400
glue_width = 6000
glue_stretch = 3000
glue_shrink = 1000

[test_vector.expected_output]
line_breaks = 0
demerits = 0.0
status = "empty"
expected_error = null

[test_vector.domain_constraints]
references = ["NC-001"]
note = "0 entities. Edge case for paragraph start/end demerits calculation."

[test_vector.verification]
source = "Reference implementation: empty paragraph produces zero-width single line"
method = "Reference implementation"
confidence = 0.95
verifier = "DeepThought"
verification_date = "2026-05-15"

[[test_vector]]
id = "TV-LB-006"
name = "Infinite penalty skip"
category = "adversarial"
priority = "critical"
description = "A break point with infinite penalty (10000+) must never be chosen unless it is the only option."

[test_vector.input]
words = ["a", "b", "c"]
word_widths = [48000, 48000, 48000]
line_width = 80000
glue_width = 6000
glue_stretch = 0
glue_shrink = 0
break_penalties = [10000, 0]

[test_vector.expected_output]
line_breaks = 1
infinite_penalty_used = false
status = "penalty_avoided"
note = "First break has penalty 10000 (infinite in TeX). Second break has penalty 0. Algorithm must choose the second break."

[test_vector.domain_constraints]
references = ["NC-001"]
note = "TeX convention: penalty >= 10000 is treated as infinite, forbidding breaks at that point."

[test_vector.verification]
source = "Reference implementation: TeX infinite penalty semantics (Knuth, 1986)"
method = "Reference implementation"
confidence = 0.99
verifier = "DeepThought"
verification_date = "2026-05-15"
