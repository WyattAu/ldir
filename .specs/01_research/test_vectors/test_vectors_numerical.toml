method = "Analytical"
confidence = 0.99
verifier = "DeepThought"
verification_date = "2026-05-15"

[[test_vector]]
id = "TV-FP-005"
name = "Fractional precision"
category = "boundary"
priority = "high"
description = "Multiplying 0.1 * 0.1 in fp266. 0.1 is not exactly representable; tests rounding behavior."

[test_vector.input]
a = { raw = 6, value = 0.09375 }
b = { raw = 6, value = 0.09375 }

[test_vector.expected_output]
result_raw = 0
result_value = 0.0
note = "6*6 = 36 in raw integer multiply, right-shifted by 6 yields 0. Exact fp266 representation of 0.1 would be raw=6 (nearest). Product rounds to 0."
ulp_error = 1

[test_vector.domain_constraints]
references = ["NC-003", "NC-004"]
note = "0.1 in fp266 is 6/64 = 0.09375. True product = 0.0087890625. Rounded to fp266 = 0."

[test_vector.verification]
source = "Mathematical derivation: (6 * 6) >> 6 = 36 >> 6 = 0"
method = "Analytical"
confidence = 0.99
verifier = "DeepThought"
verification_date = "2026-05-15"

