algorithm_version = "0.1.0"
generation_date = "2026-05-15T00:00:00Z"
generator = "manual"
verification_status = "verified"

[precision_requirements]
floating_point_type = "fp266"
absolute_tolerance = 1
relative_tolerance = 1e-10
ulp_tolerance = 1
note = "26.6 fixed-point format: 26 integer bits, 6 fractional bits. Values scaled by 64. Tolerance in ULP (unit in last place = 1/64 ≈ 0.015625)."

