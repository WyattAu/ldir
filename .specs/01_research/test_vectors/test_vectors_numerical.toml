[[test_vector]]
id = "TV-FP-004"
name = "Saturation boundaries"
category = "boundary"
priority = "critical"
description = "Multiplication at extremes: MAX*MAX and MIN*MIN should saturate to fp266 clamped range."

[test_vector.input]
