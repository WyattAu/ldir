[test_vector.expected_output]
max_times_max_raw = 2147483647
max_times_max_value = 33554431.984375
min_times_min_raw = 2147483647
min_times_min_value = 33554431.984375
status = "saturated"

[test_vector.domain_constraints]
references = ["NC-003", "NC-004"]
note = "True products (≈1.126e15) exceed i32 range; must saturate to fp266 MAX."

[test_vector.verification]
