# Domain Constraints Specification Schema v1.0.0
# LDIR Typesetting Engine Constraints

[metadata]
domain = "Typesetting & Document Layout"
derivation_date = "2026-04-23T00:00:00Z"
confidence = 0.95
sources = ["Knuth - The TeXbook (1986)", "FreeType API Reference", "PDF 2.0 (ISO 32000-2:2020)", "Knuth-Plass (1981)"]

[constraints.numerical]
[[constraints.numerical.item]]
id = "NC-001"
name = "Maximum entities per document"
description = "Maximum number of entity IDs in a single S-IR document, limited by 32-bit generation index"
value = 4294967295
unit = "entities"
source = "REQ-1.1.3 / REQ-3.1.6"
derivation = "2^32 - 1, the maximum value of a uint32"
validation_method = "Entity count check during S-IR validation"

[[constraints.numerical.item]]
id = "NC-002"
name = "Maximum nesting depth"
description = "Practical maximum depth of block nesting (paragraphs inside lists inside sections, etc.)"
value = 65535
unit = "levels"
source = "Engineering judgment based on TeX max depth"
derivation = "2^16 - 1; prevents stack overflow in traversal"
validation_method = "Stack depth check during traversal"

[[constraints.numerical.item]]
id = "NC-003"
name = "26.6 fixed-point range (minimum)"
description = "Minimum representable value in 26.6 signed fixed-point format"
value = -33554432.0
unit = "scaled points"
source = "REQ-3.2.6 / FreeType internal format"
derivation = "-2^25 = -33554432.0 (25 integer bits + 1 sign bit)"
validation_method = "Bounds check on all coordinate assignments"

[[constraints.numerical.item]]
id = "NC-004"
name = "26.6 fixed-point range (maximum)"
description = "Maximum representable value in 26.6 signed fixed-point format"
value = 33554431.984375
unit = "scaled points"
source = "REQ-3.2.6 / FreeType internal format"
derivation = "2^25 - 2^(-6) = 33554431.984375"
validation_method = "Bounds check on all coordinate assignments"

[[constraints.numerical.item]]
id = "NC-005"
name = "Fixed-point quantization error"
description = "Maximum rounding error when converting a real number to 26.6 fixed-point"
value = 0.0078125
unit = "scaled points"
source = "REQ-3.2.7"
derivation = "1/2^6 = 1/128 ≈ 0.0078125 scaled points"
validation_method = "Verify round(v * 64) is within ±0.5 of v * 64"

[[constraints.numerical.item]]
id = "NC-006"
name = "Scaled point to printer's point conversion"
description = "1 scaled point (sp) = 1/65536 printer's point"
value = 0.0000152587890625
unit = "pt"
source = "The TeXbook, Chapter 10"
derivation = "1/65536 pt per sp"
validation_method = "Unit conversion test"

[[constraints.numerical.item]]
id = "NC-007"
name = "Knuth-Plass badness overflow threshold"
description = "Badness values exceeding this are clamped to infinity (penalized break)"
value = 10000
unit = "badness units (dimensionless)"
source = "Knuth-Plass (1981), equation 4"
derivation = "b = 100 * (w-t)^3 / s^3; when |w-t| > 10*s, badness > 10000, treated as infinite"
validation_method = "Badness calculation unit test"

[[constraints.numerical.item]]
id = "NC-008"
name = "Maximum line stretch ratio"
