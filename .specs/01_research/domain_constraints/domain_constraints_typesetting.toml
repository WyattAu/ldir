value = 2.0
unit = "ratio (dimensionless)"
source = "Knuth-Plass (1981)"
derivation = "Conventional typesetting tolerance; |w-t|/s > 2.0 → infinite penalty"
validation_method = "Line break feasibility test"

[[constraints.numerical.item]]
