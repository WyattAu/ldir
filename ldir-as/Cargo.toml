[package]
name = "ldir-as"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LDIR IR assembler — converts .ldir text to binary S-IR"

[[bin]]
name = "ldir-as"
path = "src/main.rs"

[dependencies]
ldir-ir = { path = "../ldir-ir" }
clap = { version = "4", features = ["derive"] }
