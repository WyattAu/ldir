name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ldc-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: ldc-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ldc-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: ldc-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build ldc release binary
        run: cargo build --release -p ldc --target ${{ matrix.target }}

      - name: Upload ldc binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ldc${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
