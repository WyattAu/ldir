name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ldc-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ldc-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: ldc-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ldc-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: ldc-windows-x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Ubuntu x86_64)
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install system dependencies (Ubuntu aarch64 cross)
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libharfbuzz-dev:arm64 fonts-dejavu-core

      - name: Configure cross-compilation (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install harfbuzz

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build ldc release binary
        run: cargo build --release -p ldc --target ${{ matrix.target }} --locked

      - name: Upload ldc binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ldc${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}

  publish-dry-run:
    name: cargo publish --dry-run
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify all crates publishable (dry-run)
        run: |
          for crate in ldir-ir ldir-test-helpers ldir-core ldir-pdf ldir-html ldir-html-reader ldir-docx ldir-odt ldir-epub ldir-tex ldir-typst ldir-md ldir-rst ldir-org ldir-adoc ldir-txt ldir-pandoc ldir-jupyter ldir-lsp ldir-wasm ldir-bench ldc; do
            echo "--- dry-run: $crate ---"
            cargo publish -p "$crate" --dry-run --locked 2>&1 || echo "WARN: $crate not yet publishable (may depend on unpublished workspace crate)"
          done

  create-release:
    name: Create GitHub Release
    needs: [build-release, publish-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate SHA256 checksums
        working-directory: release-artifacts
        run: |
          find . -type f -name 'ldc*' -exec sha256sum {} \; > ../checksums-sha256.txt
          cat ../checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
            checksums-sha256.txt
          generate_release_notes: true
