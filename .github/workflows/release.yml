name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ldc-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: ldc-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ldc-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: ldc-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build ldc release binary
        run: cargo build --release -p ldc --target ${{ matrix.target }}

      - name: Upload ldc binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ldc${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate SHA256 checksums
        working-directory: release-artifacts
        run: |
          find . -type f -name 'ldc*' -exec sha256sum {} \; > ../checksums-sha256.txt
          cat ../checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
            checksums-sha256.txt
          generate_release_notes: true
