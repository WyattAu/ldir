name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Lean 4 (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh
          ~/.elan/bin/lake exe cache get
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      
      - name: Build (native)
        run: cargo build --workspace
      
      - name: Build (WASM)
        run: cargo build --workspace --target wasm32-unknown-unknown
        continue-on-error: true  # tokio doesn't build on WASM
      
      - name: Test
        run: cargo test --workspace -- --nocapture 2>&1 | tee test-results.txt
      
      - name: Check test results
        run: |
          if grep -q "FAILED" test-results.txt || grep -q "failed:" test-results.txt; then
            echo "::error::Tests failed"
            exit 1
          fi
      
      - name: Lean 4 proofs
        working-directory: ldir-lean
        run: ~/.elan/bin/lake build
        continue-on-error: true  # mathlib rebuilds can be slow
      
      - name: Integration tests
        run: cargo build -p ldc && cargo test --test integration -- --nocapture 2>&1 | tee integration-results.txt
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

  release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: check
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build release binaries
        run: cargo build --workspace --release
      
      - name: Upload ldc binary
        uses: actions/upload-artifact@v4
        with:
          name: ldc-linux-x86_64
          path: target/release/ldc
