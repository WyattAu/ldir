name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-check:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install harfbuzz

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace --exclude ldir-wasm -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Build documentation
        run: cargo doc --workspace --exclude ldir-wasm --no-deps

      - name: Build binaries (required for integration tests)
        run: cargo build --workspace --exclude ldir-wasm --bins

      - name: Test
        run: cargo test --workspace --exclude ldir-wasm

  msrv-check:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev

      - name: Install Rust toolchain (1.88)
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-cargo-

      - name: Check build
        run: cargo check --workspace --exclude ldir-wasm

  bench-check:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Download latest baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-baseline-main
          path: target/criterion

      - name: Build benchmarks
        run: cargo bench -p ldir-core --no-run

      - name: Run benchmarks (compare with baseline)
        if: github.event_name == 'pull_request'
        env:
          CRITERION_PLOT_GENERATION: "false"
        run: |
          cargo bench -p ldir-core -- --baseline main 2>&1 | tee bench-output.txt

      - name: Run benchmarks (save baseline)
        if: github.ref == 'refs/heads/main'
        env:
          CRITERION_PLOT_GENERATION: "false"
        run: |
          cargo bench -p ldir-core -- --save-baseline main 2>&1 | tee bench-output.txt

      - name: Check for performance regression
        if: github.event_name == 'pull_request'
        run: |
          if grep -qi "performance has regressed" bench-output.txt; then
            echo "::warning::Performance regression detected. Check benchmark output for details."
            grep -A1 "performance has regressed" bench-output.txt || true
            REGRESSIONS=$(grep -c "performance has regressed" bench-output.txt || echo 0)
            if [ "$REGRESSIONS" -gt 0 ]; then
              echo "::notice::$REGRESSIONS benchmark(s) regressed. Review before merging."
            fi
          else
            echo "No performance regressions detected."
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ github.sha }}
          path: |
            bench-output.txt
            target/criterion/
          retention-days: 14

      - name: Save baseline artifact (main only)
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: bench-baseline-main
          path: target/criterion/
          retention-days: 90

  lean4-check:
    name: Lean 4 Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
          key: lean-elan-${{ runner.os }}-${{ hashFiles('ldir-lean/lean-toolchain') }}
          restore-keys: lean-elan-

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: |
            ldir-lean/.lake
            ldir-lean/lake-packages
            ldir-lean/.lake/build/lib
          key: lean-lake-${{ runner.os }}-${{ hashFiles('ldir-lean/lakefile.lean', 'ldir-lean/lake-manifest.json', 'ldir-lean/lean-toolchain') }}
          restore-keys: lean-lake-

      - name: Install elan (Lean 4 toolchain)
        run: |
          if [ ! -d "$HOME/.elan" ]; then
            curl -sSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean project
        working-directory: ldir-lean
        run: lake build

  wasm-check:
    name: WASM Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build -p ldir-wasm --target wasm32-unknown-unknown

  feature-features:
    name: Feature Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test wasm-plugins feature
        run: |
          cargo test -p ldir-core --features wasm-plugins
          cargo clippy -p ldir-core --features wasm-plugins -- -D warnings

      - name: Test all-features (non-WASM crates)
        run: |
          cargo test -p ldir-core -p ldir-pdf -p ldir-ir --all-features
          cargo clippy -p ldir-core -p ldir-pdf -p ldir-ir --all-features -- -D warnings

  pdfa-check:
    name: PDF/A Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install veraPDF
        run: |
          curl -sL https://github.com/veraPDF/veraPDF-apps/releases/download/v1.26.2/verapdf-installer-1.26.2.zip -o /tmp/verapdf.zip
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-installer
          cd /tmp/verapdf-installer
          chmod +x verapdf-install
          ./verapdf-install -q -dir /opt/verapdf
          echo "/opt/verapdf/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pdfa-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: pdfa-cargo-

      - name: Build test binary
        run: cargo build -p ldir-core --release

      - name: Generate test PDFs
        run: |
          mkdir -p /tmp/pdfa-tests
          cargo test -p ldir-core --test integration -- --ignored 2>/dev/null || true
          cargo test -p ldir-core pdfa_generate -- --nocapture 2>/dev/null || true

      - name: Validate PDF/A conformance
        run: |
          PASS=true
          for pdf in /tmp/pdfa-tests/*.pdf; do
            if [ -f "$pdf" ]; then
              echo "Validating: $pdf"
              verapdf --format mrr "$pdf" > "${pdf}.xml" 2>&1
              if grep -q 'compliance="PASS"' "${pdf}.xml" 2>/dev/null; then
                echo "  PASS: $pdf"
              else
                echo "  WARN: $pdf (PDF/A conformance issues)"
                PASS=false
              fi
            fi
          done
          if [ "$PASS" = "true" ]; then
            echo "All PDFs passed PDF/A conformance."
          else
            echo "::warning::Some PDFs have PDF/A conformance issues. Full PDF/A support tracked in X-3."
          fi
        continue-on-error: true

  completions-check:
    name: Completions & Man Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-completions-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Generate completions and man pages
        run: cargo run -p ldc --example generate-completions

      - name: Check completions match checked-in files
        run: |
          diff -r completions/ target/completions/ || {
            echo "::error::Shell completions are out of date. Run: cargo run -p ldc --example generate-completions && cp target/completions/* completions/"
            exit 1
          }

      - name: Check man pages match checked-in files
        run: |
          diff -r man/ target/man/ || {
            echo "::error::Man pages are out of date. Run: cargo run -p ldc --example generate-completions && cp target/man/* man/"
            exit 1
          }
