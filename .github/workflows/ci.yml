name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-check:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install harfbuzz

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace --exclude ldir-wasm --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Build documentation
        run: cargo doc --workspace --exclude ldir-wasm --no-deps --locked

      - name: Build binaries (required for integration tests)
        run: cargo build --workspace --exclude ldir-wasm --bins --locked

      - name: Test
        run: cargo test --workspace --exclude ldir-wasm --locked

      - name: Doctests
        run: cargo test --workspace --exclude ldir-wasm --doc --locked

  msrv-check:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install Rust toolchain (1.88)
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-cargo-

      - name: Check build
        run: cargo check --workspace --exclude ldir-wasm --locked

  bench-check:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Download latest baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-baseline-main
          path: target/criterion

      - name: Build benchmarks
        run: cargo bench -p ldir-core --no-run

      - name: Run benchmarks (compare with baseline)
        if: github.event_name == 'pull_request'
        env:
          CRITERION_PLOT_GENERATION: "false"
        run: |
          cargo bench -p ldir-core -- --baseline main 2>&1 | tee bench-output.txt

      - name: Run benchmarks (save baseline)
        if: github.ref == 'refs/heads/main'
        env:
          CRITERION_PLOT_GENERATION: "false"
        run: |
          cargo bench -p ldir-core -- --save-baseline main 2>&1 | tee bench-output.txt

      - name: Check for performance regression
        if: github.event_name == 'pull_request'
        run: |
          if grep -qi "performance has regressed" bench-output.txt; then
            echo "::warning::Performance regression detected. Check benchmark output for details."
            grep -A1 "performance has regressed" bench-output.txt || true
            REGRESSIONS=$(grep -c "performance has regressed" bench-output.txt || echo 0)
            if [ "$REGRESSIONS" -gt 0 ]; then
              echo "::notice::$REGRESSIONS benchmark(s) regressed. Review before merging."
            fi
          else
            echo "No performance regressions detected."
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ github.sha }}
          path: |
            bench-output.txt
            target/criterion/
          retention-days: 14

      - name: Save baseline artifact (main only)
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: bench-baseline-main
          path: target/criterion/
          retention-days: 90

  lean4-check:
    name: Lean 4 Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
          key: lean-elan-${{ runner.os }}-${{ hashFiles('ldir-lean/lean-toolchain') }}
          restore-keys: lean-elan-

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: |
            ldir-lean/.lake
            ldir-lean/lake-packages
            ldir-lean/.lake/build/lib
          key: lean-lake-${{ runner.os }}-${{ hashFiles('ldir-lean/lakefile.lean', 'ldir-lean/lake-manifest.json', 'ldir-lean/lean-toolchain') }}
          restore-keys: lean-lake-

      - name: Install elan (Lean 4 toolchain)
        run: |
          if [ ! -d "$HOME/.elan" ]; then
            curl -sSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean project
        working-directory: ldir-lean
        run: lake build 2>&1 | tail -20

  wasm-check:
    name: WASM Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build -p ldir-wasm --target wasm32-unknown-unknown

  feature-gates:
    name: Feature Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test wasm-plugins feature
        run: |
          cargo test -p ldir-core --features wasm-plugins --locked
          cargo clippy -p ldir-core --features wasm-plugins --locked -- -D warnings

      - name: Test all-features (non-WASM crates)
        run: |
          cargo test -p ldir-core -p ldir-pdf -p ldir-ir --all-features --locked
          cargo clippy -p ldir-core -p ldir-pdf -p ldir-ir --all-features --locked -- -D warnings

  pdfa-check:
    name: PDF/A Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install veraPDF
        run: |
          curl -sL https://software.verapdf.org/rel/verapdf-installer.zip -o /tmp/verapdf.zip
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-installer
          cd /tmp/verapdf-installer/verapdf-greenfield-*
          # Generate automated install config (CLI + scripts only, no GUI/docs)
          cat > /tmp/auto-install.xml <<'XMLEOF'
          <AutomatedInstallation langpack="eng">
              <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
              <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
                  <installpath>/opt/verapdf</installpath>
              </com.izforge.izpack.panels.target.TargetPanel>
              <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
                  <pack index="0" name="veraPDF GUI" selected="false"/>
                  <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
                  <pack index="2" name="veraPDF Validation model" selected="false"/>
                  <pack index="3" name="veraPDF Documentation" selected="false"/>
                  <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
              </com.izforge.izpack.panels.packs.PacksPanel>
              <com.izforge.izpack.panels.install.InstallPanel id="install"/>
              <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XMLEOF
          chmod +x verapdf-install
          java -jar verapdf-izpack-installer-*.jar /tmp/auto-install.xml
          echo "/opt/verapdf/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pdfa-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: pdfa-cargo-

      - name: Build ldc binary
        run: cargo build -p ldc --release --locked

      - name: Generate test PDFs
        run: |
          mkdir -p /tmp/pdfa-tests
          printf '# Hello PDF/A\n\nThis is a test document for PDF/A conformance validation.\n\n' > /tmp/pdfa-tests/test.md
          ./target/release/ldc /tmp/pdfa-tests/test.md --pdfa-level 4 -o /tmp/pdfa-tests/test.pdfa.pdf
          echo "Generated test PDFs:"
          ls -la /tmp/pdfa-tests/*.pdf 2>/dev/null || echo "No PDFs generated"

      - name: Validate PDF/A conformance
        run: |
          PASS=true
          for pdf in /tmp/pdfa-tests/*.pdf; do
            if [ -f "$pdf" ]; then
              echo "Validating: $pdf"
              verapdf --format mrr "$pdf" > "${pdf}.xml" 2>&1
              if grep -q 'compliance="PASS"' "${pdf}.xml" 2>/dev/null; then
                echo "  PASS: $pdf"
              else
                echo "  WARN: $pdf (PDF/A conformance issues)"
                PASS=false
              fi
            fi
          done
          if [ "$PASS" = "true" ]; then
            echo "All PDFs passed PDF/A conformance."
          else
            echo "::warning::Some PDFs have PDF/A conformance issues. Full PDF/A support tracked in X-3."
          fi
        continue-on-error: true

  completions-check:
    name: Completions & Man Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-completions-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Generate completions and man pages
        run: cargo run -p ldc --example generate-completions --locked

      - name: Check completions match checked-in files
        run: |
          diff -r completions/ target/completions/ || {
            echo "::error::Shell completions are out of date. Run: cargo run -p ldc --example generate-completions && cp target/completions/* completions/"
            exit 1
          }

      - name: Check man pages match checked-in files
        run: |
          diff -r man/ target/man/ || {
            echo "::error::Man pages are out of date. Run: cargo run -p ldc --example generate-completions && cp target/man/* man/"
            exit 1
          }

  cross-platform-determinism:
    name: Cross-Platform Determinism
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install harfbuzz

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-det-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create test document
        shell: bash
        run: |
          cat > /tmp/det-test.md << 'MDEOF'
          # Determinism Test

          ## Section One

          This is a deterministic test document for cross-platform
          verification. It contains ASCII text, a table, and a list.

          | Column A | Column B |
          |---------|---------|
          | 1 | 2 |
          | 3 | 4 |

          - Item one
          - Item two
          MDEOF

      - name: Build ldc
        run: cargo build --release -p ldc --locked

      - name: Compile test document and compute hash
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            LDC="./target/release/ldc.exe"
          else
            LDC="./target/release/ldc"
          fi
          "$LDC" /tmp/det-test.md -o /tmp/det-test.pdf
          sha256sum /tmp/det-test.pdf > /tmp/hash.txt
          echo "Hash: $(awk '{print $1}' /tmp/hash.txt)"

      - name: Download baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: determinism-baseline-Linux
          path: /tmp/baseline-hash.txt

      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ -f /tmp/baseline-hash.txt ] && [ -f /tmp/hash.txt ]; then
            BASELINE=$(awk '{print $1}' /tmp/baseline-hash.txt)
            CURRENT=$(awk '{print $1}' /tmp/hash.txt)
            if [ "$BASELINE" = "$CURRENT" ]; then
              echo "Cross-platform determinism: PASS (hashes match)"
            else
              echo "::warning::Cross-platform determinism: hashes differ. Linux baseline=$BASELINE current=${{ runner.os }}=$CURRENT"
              echo "This may indicate a platform-specific rendering difference. Review before merging."
            fi
          fi

      - name: Upload hash artifact (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: determinism-baseline-${{ runner.os }}
          path: /tmp/hash.txt
          retention-days: 90

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: security-audit-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: security-audit-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings

  pdfa-conformance:
    name: PDF/A Conformance Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev fonts-dejavu-core wget unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-pdfa-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-pdfa-

      - name: Build ldc
        run: cargo build --release -p ldc --locked

      - name: Create test document
        shell: bash
        run: |
          cat > /tmp/pdfa-test.md << 'MDEOF'
          # PDF/A Conformance Test

          ## Section

          This document tests PDF/A-2b conformance with embedded fonts
          and proper metadata.

          | Header 1 | Header 2 |
          |----------|----------|
          | Cell A   | Cell B   |
          | Cell C   | Cell D   |

          - List item one
          - List item two
          MDEOF

      - name: Compile with PDF/A
        shell: bash
        run: |
          ./target/release/ldc /tmp/pdfa-test.md --pdfa-level 2b -o /tmp/pdfa-test.pdf

      - name: Install veraPDF
        continue-on-error: true
        run: |
          VERAPDF_VERSION="1.26.4"
          wget -q "https://github.com/veraPDF/veraPDF-apps/releases/download/v${VERAPDF_VERSION}/verapdf-${VERAPDF_VERSION}.zip" -O verapdf.zip
          unzip -q verapdf.zip
          chmod +x verapdf-${VERAPDF_VERSION}/verapdf

      - name: Validate PDF/A conformance
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          RESULT=$(verapdf-*/verapdf --flavour 2b /tmp/pdfa-test.pdf 2>&1)
          echo "$RESULT"
          if echo "$RESULT" | grep -qi "VALID"; then
            echo "status=valid" >> $GITHUB_OUTPUT
          elif echo "$RESULT" | grep -qi "INVALID"; then
            echo "status=invalid" >> $GITHUB_OUTPUT
            echo "::warning::PDF/A-2b conformance check failed"
          else
            echo "status=unknown" >> $GITHUB_OUTPUT
            echo "::warning::veraPDF output could not be parsed"
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "PDF/A conformance status: ${{ steps.validate.outputs.status }}"
          if [ "${{ steps.validate.outputs.status }}" = "invalid" ]; then
            echo "::notice::PDF/A-2b validation found issues. Review veraPDF output above."
          fi
