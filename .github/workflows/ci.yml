name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-check:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --workspace

  msrv-check:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.85)
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-cargo-

      - name: Check build
        run: cargo check --workspace

  bench-check:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Download latest baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-baseline-main
          path: target/criterion

      - name: Build benchmarks
        run: cargo bench -p ldir-core --no-run

      - name: Run benchmarks (compare with baseline)
        if: github.event_name == 'pull_request'
        env:
          CRITERION_PLOT_GENERATION: "false"
        run: |
          cargo bench -p ldir-core -- --baseline main 2>&1 | tee bench-output.txt

      - name: Run benchmarks (save baseline)
        if: github.ref == 'refs/heads/main'
        env:
          CRITERION_PLOT_GENERATION: "false"
        run: |
          cargo bench -p ldir-core -- --save-baseline main 2>&1 | tee bench-output.txt

      - name: Check for performance regression
        if: github.event_name == 'pull_request'
        run: |
          REGRESSION_THRESHOLD=5
          if grep -qi "performance has regressed" bench-output.txt; then
            echo "::warning::Performance regression detected. Check benchmark output for details."
            # Extract regression lines for summary
            grep -A1 "performance has regressed" bench-output.txt || true
            # Count regressions exceeding threshold
            REGRESSIONS=$(grep -c "performance has regressed" bench-output.txt || echo 0)
            if [ "$REGRESSIONS" -gt 0 ]; then
              echo "::notice::$REGRESSIONS benchmark(s) regressed. Review before merging."
            fi
          else
            echo "No performance regressions detected."
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ github.sha }}
          path: |
            bench-output.txt
            target/criterion/
          retention-days: 14

      - name: Save baseline artifact (main only)
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: bench-baseline-main
          path: target/criterion/
          retention-days: 90

  lean4-check:
    name: Lean 4 Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4 (elan)
        uses: leanprover/elan-action@v4

      - name: Build Lean project
        working-directory: ldir-lean
        run: lake build

  wasm-check:
    name: WASM Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build -p ldir-wasm --target wasm32-unknown-unknown

  feature-features:
    name: Feature Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test wasm-plugins feature
        run: |
          cargo test -p ldir-core --features wasm-plugins
          cargo clippy -p ldir-core --features wasm-plugins -- -D warnings

      - name: Test all-features (non-WASM crates)
        run: |
          cargo test -p ldir-core -p ldir-pdf -p ldir-ir --all-features
          cargo clippy -p ldir-core -p ldir-pdf -p ldir-ir --all-features -- -D warnings
