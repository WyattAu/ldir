name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ldir-wasm/playground/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: |
          mkdir -p _site
          # Copy static docs site
          cp -r docs/*.html docs/css docs/js _site/ 2>/dev/null || true
          # Copy WASM playground on top
          cp -r ldir-wasm/playground/* _site/ 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
