name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'ldir-*/**'
      - '.specs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/**'
      - 'man/**'
      - 'completions/**'

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build Rust documentation
        run: cargo doc --workspace --exclude ldir-wasm --no-deps --locked

      - name: Build mdBook documentation
        run: mdbook build docs/book

      - name: Add landing page
        run: |
          cp docs/index.html target/doc/index.html

      - name: Merge mdBook output into doc output
        run: |
          cp -r docs/book/book/* target/doc/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
