[package]
name = "ldir-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "LDIR Language Server Protocol server for Markdown, TeX, and Typst"
readme = "README.md"
keywords = ["lsp", "language-server", "editor", "ide"]
categories = ["development-tools"]

[[bin]]
name = "ldir-lsp"
path = "src/main.rs"

[dependencies]
ldir-core = { workspace = true }
ldir-md = { workspace = true }
ldir-pdf = { workspace = true }
ldir-tex = { workspace = true }
ldir-typst = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

[dev-dependencies]
url = "2"
