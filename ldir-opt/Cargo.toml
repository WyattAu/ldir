[package]
name = "ldir-opt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LDIR IR optimizer — applies transformation passes to S-IR v2 modules"
repository.workspace = true
readme = "README.md"
keywords = ["optimizer", "ir", "document", "cli"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "ldir-opt"
path = "src/main.rs"

[dependencies]
ldir-ir = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
