[package]
name = "ldir-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LDIR WASM bridge — browser-based document compilation"
repository.workspace = true
readme = "README.md"
keywords = ["wasm", "webassembly", "browser", "document", "compilation"]
categories = ["wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ldir-ir = { workspace = true }
ldir-md = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
]

[features]
unstable = []

[dev-dependencies]
wasm-bindgen-test = "0.3"
