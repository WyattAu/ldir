<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ldir Playground</title>
    <style>
        :root {
            --color-bg: #fafafa;
            --color-editor-bg: #fff;
            --color-preview-bg: #fff;
            --color-border: #e1e4e8;
            --color-text: #1a1a1a;
            --color-heading: #0366d6;
            --font-mono: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-body);
            color: var(--color-text);
            background: var(--color-bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--color-border);
            background: #fff;
        }
        
        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-heading);
        }
        
        .header .version {
            font-size: 12px;
            color: #666;
        }
        
        .toolbar {
            display: flex;
            gap: 8px;
            padding: 4px 16px;
            border-bottom: 1px solid var(--color-border);
            background: #fff;
        }
        
        .toolbar button {
            font-size: 12px;
            padding: 4px 12px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
        
        .toolbar button:hover {
            background: #f0f0f0;
        }
        
        .toolbar select {
            font-size: 12px;
            padding: 4px 8px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
        }
        
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .editor-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--color-border);
        }
        
        .preview-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #666;
            padding: 4px 12px;
            border-bottom: 1px solid var(--color-border);
            background: #f6f8fa;
        }
        
        #editor {
            flex: 1;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
            padding: 12px;
            border: none;
            outline: none;
            resize: none;
            background: var(--color-editor-bg);
            tab-size: 4;
        }
        
        #preview {
            flex: 1;
            padding: 16px;
            overflow: auto;
            background: var(--color-preview-bg);
        }
        
        #preview h1 { font-size: 2em; border-bottom: 1px solid var(--color-border); padding-bottom: 0.3em; margin: 0.5em 0; }
        #preview h2 { font-size: 1.5em; border-bottom: 1px solid var(--color-border); padding-bottom: 0.3em; margin: 0.5em 0; }
        #preview h3 { font-size: 1.25em; margin: 0.5em 0; }
        #preview p { margin: 0.5em 0; }
        #preview code { font-family: var(--font-mono); font-size: 0.85em; background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 3px; }
        #preview pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow-x: auto; border: 1px solid var(--color-border); }
        #preview pre code { background: none; padding: 0; }
        #preview blockquote { border-left: 4px solid #dfe2e5; padding: 0.5em 1em; margin: 0.5em 0; color: #555; }
        #preview table { border-collapse: collapse; width: 100%; margin: 0.5em 0; }
        #preview th, #preview td { padding: 6px 13px; border: 1px solid #dfe2e5; }
        #preview th { background: #f6f8fa; font-weight: 600; }
        #preview a { color: #0366d6; text-decoration: none; }
        #preview a:hover { text-decoration: underline; }
        #preview img { max-width: 100%; }
        #preview hr { border: none; border-top: 1px solid var(--color-border); margin: 1em 0; }
        #preview ul, #preview ol { padding-left: 2em; margin: 0.5em 0; }
        #preview li { margin: 0.25em 0; }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #666;
            padding: 2px 16px;
            border-top: 1px solid var(--color-border);
            background: #f6f8fa;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ldir Playground</h1>
        <span class="version">v0.1.0</span>
    </div>
    <div class="toolbar">
        <select id="input-format">
            <option value="markdown">Markdown</option>
            <option value="latex">LaTeX</option>
        </select>
        <button id="btn-render">Render</button>
        <button id="btn-share">Share URL</button>
        <button id="btn-example">Load Example</button>
    </div>
    <div class="main">
        <div class="editor-panel">
            <div class="panel-label">Input</div>
            <textarea id="editor" spellcheck="false" placeholder="Type markdown here..."></textarea>
        </div>
        <div class="preview-panel">
            <div class="panel-label">Preview</div>
            <div id="preview">
                <div class="loading">Loading WASM module...</div>
            </div>
        </div>
    </div>
    <div class="status-bar">
        <span id="char-count">0 characters</span>
        <span id="compile-time"></span>
    </div>
    <script>
        // Default content
        const DEFAULT_CONTENT = `# Welcome to ldir Playground

This is an interactive playground for the **ldir** document compiler.

## Features

- **9 input formats**: Markdown, LaTeX, Typst, HTML, and more
- **Three-layer IR pipeline**: S-IR -> L-IR -> G-IR
- **Formal verification**: Lean4 proofs

## Example

\`\`\`latex
\\begin{equation}
E = mc^2
\\end{equation}
\`\`\`

| Feature | Status |
|---------|--------|
| Markdown | Complete |
| LaTeX | Partial |
| Typst | Complete |

> This is a blockquote. ldir uses Knuth-Plass line breaking
> for optimal paragraph formatting.

---

*This playground runs entirely in your browser using WebAssembly.*`;

        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const charCount = document.getElementById('char-count');
        const compileTime = document.getElementById('compile-time');
        
        editor.value = DEFAULT_CONTENT;
        
        // Update character count
        editor.addEventListener('input', () => {
            charCount.textContent = editor.value.length + ' characters';
        });
        charCount.textContent = editor.value.length + ' characters';
        
        // Render button
        document.getElementById('btn-render').addEventListener('click', () => {
            const start = performance.now();
            const input = editor.value;
            const format = document.getElementById('input-format').value;
            
            try {
                // Try WASM rendering first
                if (typeof ldir !== 'undefined') {
                    const result = ldir.compile(input, format);
                    preview.innerHTML = result;
                } else {
                    // Fallback: basic markdown rendering
                    renderFallback(input);
                }
                const elapsed = (performance.now() - start).toFixed(1);
                compileTime.textContent = 'Compiled in ' + elapsed + 'ms';
            } catch (e) {
                preview.innerHTML = '<div class="loading" style="color:red">Error: ' + e.message + '</div>';
                compileTime.textContent = 'Error';
            }
        });
        
        // Share URL button
        document.getElementById('btn-share').addEventListener('click', () => {
            const encoded = btoa(encodeURIComponent(editor.value));
            const url = window.location.origin + window.location.pathname + '#' + encoded;
            navigator.clipboard.writeText(url).then(() => {
                compileTime.textContent = 'URL copied to clipboard';
            });
        });
        
        // Load from URL hash
        function loadFromHash() {
            const hash = window.location.hash.slice(1);
            if (hash) {
                try {
                    editor.value = decodeURIComponent(atob(hash));
                    charCount.textContent = editor.value.length + ' characters';
                    document.getElementById('btn-render').click();
                } catch (e) { /* ignore invalid hash */ }
            }
        }
        
        // Load example
        document.getElementById('btn-example').addEventListener('click', () => {
            editor.value = DEFAULT_CONTENT;
            charCount.textContent = editor.value.length + ' characters';
            document.getElementById('btn-render').click();
        });
        
        // Fallback rendering (when WASM is not loaded)
        function renderFallback(md) {
            let html = md
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/^> (.+)$/gm, '<blockquote><p>$1</p></blockquote>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                .replace(/^---$/gm, '<hr>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\|(.+)\|/g, function(match) {
                    const cells = match.split('|').filter(c => c.trim());
                    if (cells.every(c => /^[-:]+$/.test(c.trim()))) return '';
                    const isHeader = false; // simplified
                    const tag = 'td';
                    return '<tr>' + cells.map(c => '<' + tag + '>' + c.trim() + '</' + tag + '>').join('') + '</tr>';
                })
                .replace(/<tr>.*<\/tr>/gs, '<table>$&</table>');
            
            preview.innerHTML = html;
        }
        
        // Auto-render on load
        window.addEventListener('load', () => {
            loadFromHash();
            if (!window.location.hash) {
                document.getElementById('btn-render').click();
            }
        });
        
        // Keyboard shortcut: Ctrl+Enter to render
        editor.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('btn-render').click();
            }
            // Tab key inserts spaces
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 4;
            }
        });
    </script>
</body>
</html>
