<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ldir — Document Playground</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #fff;
            color: #333;
            transition: background 0.3s, color 0.3s;
        }
        .toolbar {
            background: #1e1e1e;
            color: #fff;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .toolbar h1 { font-size: 14px; font-weight: 500; }
        .toolbar .version { font-size: 11px; color: #888; }
        .toolbar button {
            background: #0e639c;
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .toolbar button:hover { background: #1177bb; }
        .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }

        .split { display: flex; flex: 1; overflow: hidden; }
        .editor-pane { width: 50%; overflow: hidden; display: flex; flex-direction: column; }
        .preview-pane { width: 50%; overflow: auto; padding: 16px; position: relative; }
        .divider {
            width: 4px;
            background: #ddd;
            cursor: col-resize;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .divider:hover, .divider.active { background: #0e639c; }

        .editor-wrap { flex: 1; display: flex; overflow: hidden; }
        .editor-wrap textarea {
            width: 100%;
            height: 100%;
            border: none;
            padding: 16px;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            line-height: 1.6;
            tab-size: 4;
            background: #fafafa;
            color: #333;
        }

        .statusbar {
            background: #1e1e1e;
            color: #aaa;
            padding: 3px 16px;
            font-size: 11px;
            display: flex;
            gap: 16px;
            flex-shrink: 0;
        }

        /* Preview document styles */
        .preview-pane .ldir-document {
            max-width: 680px;
            margin: 0 auto;
            font-family: 'Georgia', serif;
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }
        .preview-pane h1 { font-size: 2em; margin: 0.67em 0; font-weight: 700; border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
        .preview-pane h2 { font-size: 1.5em; margin: 0.83em 0; font-weight: 600; border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
        .preview-pane h3 { font-size: 1.17em; margin: 1em 0; font-weight: 600; }
        .preview-pane h4 { font-size: 1em; margin: 1.33em 0; font-weight: 600; }
        .preview-pane h5 { font-size: 0.83em; margin: 1.67em 0; font-weight: 600; }
        .preview-pane h6 { font-size: 0.67em; margin: 2.33em 0; font-weight: 600; }
        .preview-pane p { margin: 1em 0; }
        .preview-pane code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-family: monospace; font-size: 0.9em; }
        .preview-pane blockquote { border-left: 3px solid #ddd; margin: 1em 0; padding-left: 1em; color: #666; }
        .preview-pane ul, .preview-pane ol { margin: 1em 0; padding-left: 2em; }
        .preview-pane strong { font-weight: 700; }
        .preview-pane em { font-style: italic; }
        .preview-pane a { color: #0e639c; text-decoration: none; }
        .preview-pane a:hover { text-decoration: underline; }
        .preview-pane hr { border: none; border-top: 1px solid #eee; margin: 2em 0; }
        .preview-pane table { border-collapse: collapse; margin: 1em 0; }
        .preview-pane td, .preview-pane th { border: 1px solid #ddd; padding: 6px 13px; }
        .preview-pane th { background: #f5f5f5; }

        /* Code block container */
        .code-container {
            position: relative;
            margin: 1em 0;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #e1e4e8;
        }
        .code-container .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.06);
            color: #555;
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            z-index: 1;
            transition: background 0.2s;
        }
        .code-container .copy-btn:hover { background: rgba(0, 0, 0, 0.12); }
        .code-block {
            background: #f6f8fa;
            padding: 16px;
            overflow-x: auto;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .code-block code { background: none; padding: 0; font-size: inherit; white-space: pre; }

        /* Line numbers */
        .ln {
            display: inline-block;
            width: 3.5em;
            text-align: right;
            padding-right: 1em;
            color: rgba(0, 0, 0, 0.35);
            user-select: none;
            -webkit-user-select: none;
        }

        /* Syntax highlighting — light */
        .kw { color: #d73a49; }
        .str { color: #032f62; }
        .cmt { color: #6a737d; font-style: italic; }
        .num { color: #005cc5; }

        /* Loading spinner */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
            font-size: 14px;
        }
        .loading::before {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ddd;
            border-top-color: #0e639c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Compiling overlay */
        .compiling { opacity: 0.6; pointer-events: none; }
        .compiling::after {
            content: 'Compiling...';
            position: absolute;
            top: 8px;
            right: 8px;
            background: #0e639c;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            z-index: 2;
        }

        /* ── Dark mode ── */
        @media (prefers-color-scheme: dark) {
            body { background: #1e1e1e; color: #d4d4d4; }
            .editor-wrap textarea { background: #1e1e1e; color: #d4d4d4; }
            .divider { background: #404040; }
            .divider:hover, .divider.active { background: #569cd6; }

            .preview-pane .ldir-document { color: #d4d4d4; }
            .preview-pane h1, .preview-pane h2 { border-bottom-color: #404040; }
            .preview-pane code { background: #2d2d2d; }
            .preview-pane blockquote { border-left-color: #555; color: #aaa; }
            .preview-pane a { color: #569cd6; }
            .preview-pane hr { border-top-color: #404040; }
            .preview-pane td, .preview-pane th { border-color: #404040; }
            .preview-pane th { background: #2d2d2d; }

            .code-container { border-color: #404040; }
            .code-container .copy-btn {
                background: rgba(255,255,255,0.08);
                color: #aaa;
                border-color: rgba(255,255,255,0.12);
            }
            .code-container .copy-btn:hover { background: rgba(255,255,255,0.15); }
            .code-block { background: #2d2d2d; }
            .ln { color: rgba(255,255,255,0.35); }

            .kw  { color: #569cd6; }
            .str { color: #ce9178; }
            .cmt { color: #6a9955; }
            .num { color: #b5cea8; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1>ldir</h1>
        <span class="version" id="version">loading...</span>
        <button onclick="compile()" id="compileBtn">Compile</button>
    </div>
    <div class="split" id="split">
        <div class="editor-pane" id="editorPane">
            <div class="editor-wrap">
                <textarea id="editor" spellcheck="false"># Hello, ldir!

This is a **document playground** powered by ldir's WASM module.

## Features

- Markdown parsing
- Semantic HTML output
- Live preview
- Syntax highlighting

### Code Example

```rust
fn main() {
    println!("Hello from ldir!");
    // A comment
    let x = 42;
}
```

> This is a blockquote.

### Links

Visit [ldir on GitHub](https://github.com/WyattAu/ldir) for more info.

---

*Italic text* and **bold text** work too.
</textarea>
            </div>
        </div>
        <div class="divider" id="divider"></div>
        <div class="preview-pane" id="preview">
            <div class="loading">Loading WASM module...</div>
        </div>
    </div>
    <div class="statusbar">
        <span id="stats">0 characters &middot; 0 words &middot; 0 lines</span>
    </div>

    <script type="module">
        import init, { compile_markdown_to_html, version } from '../pkg/ldir_wasm.js';

        let compileTimeout = null;

        function updateStats() {
            const text = document.getElementById('editor').value;
            const chars = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const lines = text.split('\n').length;
            document.getElementById('stats').textContent =
                `${chars} characters \u00b7 ${words} words \u00b7 ${lines} lines`;
        }

        function copyCode(btn) {
            const container = btn.parentElement;
            const code = container.querySelector('code');
            const clone = code.cloneNode(true);
            clone.querySelectorAll('.ln').forEach(el => el.remove());
            const text = clone.textContent;
            const done = (ok) => {
                const orig = btn.textContent;
                btn.textContent = ok ? 'Copied!' : 'Failed';
                setTimeout(() => { btn.textContent = orig; }, 2000);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text.trim()).then(() => done(true), () => done(false));
            } else {
                const ta = document.createElement('textarea');
                ta.value = text.trim();
                ta.style.cssText = 'position:fixed;opacity:0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); done(true); }
                catch { done(false); }
                document.body.removeChild(ta);
            }
        }
        window.copyCode = copyCode;

        function debounceCompile() {
            if (compileTimeout) clearTimeout(compileTimeout);
            compileTimeout = setTimeout(compile, 300);
        }

        window.compile = function() {
            const md = document.getElementById('editor').value;
            const preview = document.getElementById('preview');
            preview.classList.add('compiling');
            requestAnimationFrame(() => {
                const html = compile_markdown_to_html(md);
                preview.classList.remove('compiling');
                preview.innerHTML = html || '<div class="loading">Empty document</div>';
            });
        };

        // ── Resizable split pane ──
        const divider = document.getElementById('divider');
        const editorPane = document.getElementById('editorPane');
        const previewPane = document.getElementById('previewPane');

        divider.addEventListener('mousedown', (e) => {
            e.preventDefault();
            divider.classList.add('active');
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', onStop);
            document.addEventListener('selectstart', preventSelect);
        });

        function onDrag(e) {
            const rect = document.getElementById('split').getBoundingClientRect();
            const pct = ((e.clientX - rect.left) / rect.width) * 100;
            const clamped = Math.max(20, Math.min(80, pct));
            editorPane.style.width = clamped + '%';
            previewPane.style.width = (100 - clamped) + '%';
        }

        function onStop() {
            divider.classList.remove('active');
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', onStop);
            document.removeEventListener('selectstart', preventSelect);
        }

        function preventSelect(e) { e.preventDefault(); }

        async function main() {
            await init();
            document.getElementById('version').textContent = 'v' + version();
            updateStats();
            compile();
            document.getElementById('editor').addEventListener('input', () => {
                updateStats();
                debounceCompile();
            });
        }

        main().catch(err => {
            document.getElementById('preview').innerHTML =
                `<div class="loading">Failed to load: ${err}</div>`;
        });
    </script>
</body>
</html>
